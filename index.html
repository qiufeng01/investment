<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>个人投资计划</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
    </script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js">
    </script>
    <style>
        :root {
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --primary: #1e3b5c;
            --primary-light: #2b557a;
            --accent: #b98b5f;
            --positive: #2d7d46;
            --negative: #c64545;
            --text: #1e2a36;
            --text-secondary: #4a5b6b;
            --text-muted: #7c8b98;
            --border: #dce2e8;
            --border-light: #eef1f5;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
            padding: 20px 16px 40px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        .container {
            max-width: 1060px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-light);
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 14px;
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 10px 18px;
            box-shadow: var(--shadow);
            margin-bottom: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .top-bar .main-title {
            font-weight: 600;
            color: var(--primary);
        }
        .sync-badge {
            background: #e9f0f7;
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: #f0f3f7;
            color: var(--text);
            transition: background 0.15s;
            white-space: nowrap;
            border: 1px solid transparent;
        }
        .btn:hover {
            background: #e4e9f0;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border: 1px solid var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-light);
        }
        .btn-accent {
            background: #f5efe8;
            color: #5e3e1c;
            border: 1px solid #dccbb8;
        }
        .btn-accent:hover {
            background: #efe2d3;
        }
        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }
        .btn-xs {
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 4px;
        }
        .btn-outline {
            background: #fff;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            background: #f9fafb;
        }
        .btn-danger {
            background: #fff;
            color: var(--negative);
            border: 1px solid #f1cfcf;
        }
        .btn-danger:hover {
            background: #fef5f5;
        }
        input,
        select {
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
            font-family: var(--font-mono);
            transition: border-color 0.15s;
            width: 140px;
        }
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(27, 59, 92, 0.06);
        }
        .input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 6px;
        }
        .stat-item {
            background: #f9fafc;
            border-radius: 8px;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
        }
        .stat-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .stat-value {
            font-size: 20px;
            font-weight: 600;
            font-family: var(--font-mono);
            margin-top: 4px;
            color: var(--text);
        }
        .stat-value.positive {
            color: var(--positive);
        }
        .stat-value.negative {
            color: var(--negative);
        }
        .progress-bar {
            height: 8px;
            background: #e9ecf1;
            border-radius: 10px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: #3b5f7a;
            transition: width 0.4s;
        }
        .progress-fill.over {
            background: #2d7d46;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            text-align: left;
            padding: 10px 12px;
            background: #f8fafb;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            letter-spacing: 0.3px;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-light);
        }
        .chart-wrap {
            width: 100%;
            height: 320px;
            margin-top: 8px;
        }
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        .tab {
            padding: 6px 14px;
            background: #f2f4f7;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            color: var(--text-secondary);
        }
        .tab.active {
            background: var(--primary);
            color: #fff;
        }
        .toast-wrap {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .toast {
            background: #1e293b;
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .muted {
            color: var(--text-muted);
            font-size: 12px;
        }
        @media (max-width: 640px) {
            body {
                padding: 10px 8px 30px;
            }
            .card {
                padding: 14px;
            }
            input {
                width: 100%;
            }
            .stat-grid {
                grid-template-columns: 1fr 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 6px;
            }
            .top-bar>div {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <span class="main-title" id="mainTitle">📊 个人投资记录</span>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <button class="btn btn-outline btn-xs" onclick="exportToExcel()">📥 导出Excel</button>
                <button class="btn btn-outline btn-xs" onclick="exportJSON()">📦 导出JSON</button>
                <button class="btn btn-outline btn-xs" onclick="document.getElementById('importFile').click()">📂 导入JSON</button>
                <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
                <span class="sync-badge" id="syncStatus">⏳ 未登录</span>
                <button class="btn btn-danger btn-xs" onclick="signOut()">🚪 退出</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span class="card-title">🎯 投资目标</span></div>
            <div class="input-group" style="margin-bottom:12px; flex-wrap:wrap;">
                <span>目标金额 ¥</span>
                <input type="number" id="goalInput" placeholder="金额" step="1000" style="width:130px;">
                <button class="btn btn-primary btn-sm" onclick="saveGoal()">保存金额</button>
                <span style="margin-left:12px;">目标年份</span>
                <input type="number" id="targetYearInput" placeholder="例如2045" step="1" min="2025" style="width:100px;">
                <button class="btn btn-accent btn-sm" onclick="saveTargetYear()">设定年份</button>
            </div>
            <div class="stat-grid">
                <div class="stat-item"><div class="stat-label">目标完成率</div><div class="stat-value" id="goalPercent">--</div></div>
                <div class="stat-item"><div class="stat-label">当前总市值</div><div class="stat-value" id="totalMarketValue">--</div></div>
            </div>
            <div class="progress-bar"><div class="progress-fill" id="goalProgress" style="width:0%"></div></div>
            <div class="muted" style="margin-top:6px;" id="goalMessage"></div>
        </div>

        <div class="card">
            <div class="stat-grid">
                <div class="stat-item"><div class="stat-label">总收益率</div><div class="stat-value" id="totalReturn">--</div><div class="muted" id="totalReturnAmount"></div></div>
                <div class="stat-item"><div class="stat-label">年化收益率</div><div class="stat-value" id="annualReturn">--</div><div class="muted" id="annualNote"></div></div>
                <div class="stat-item"><div class="stat-label">今日更新状态</div><div class="stat-value" style="font-size:15px;" id="updateStatus">未更新</div><button class="btn btn-outline btn-xs" style="margin-top:6px;" onclick="manualRefresh()">🔄 立即刷新</button></div>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><span class="card-title">📦 持仓与资产</span><span class="muted">股票 · 基金 · 黄金 · 存款 · 现金</span></div>
            <div class="input-group" style="margin-bottom:12px; flex-wrap:wrap;">
                <select id="assetType" style="width:110px;"><option value="stock">股票</option><option value="fund">基金</option><option value="gold">黄金现货</option><option value="deposit">银行存款</option><option value="cash">现金(余额宝)</option></select>
                <input type="text" id="assetCode" placeholder="代码 (sh600000)" style="width:130px;">
                <input type="number" id="assetAmount" placeholder="数量/金额" step="0.01" style="width:120px;">
                <input type="number" id="assetCost" placeholder="成本价/利率" step="0.001" style="width:120px;">
                <input type="date" id="assetDate" style="width:130px;">
                <button class="btn btn-primary btn-sm" onclick="addAsset()">添加</button>
            </div>
            <div class="table-wrap">
                <table id="assetTable">
                    <thead><tr><th>类型</th><th>代码/名称</th><th>数量</th><th>成本</th><th>现价</th><th>市值</th><th>盈亏/状态</th><th>操作</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🥧 资产分布</div>
            <div id="pieChart" class="chart-wrap"></div>
        </div>

        <div class="card">
            <div class="card-title">📈 历史走势</div>
            <div class="tabs" id="chartTabs">
                <button class="tab active" data-type="totalValue">总市值</button>
                <button class="tab" data-type="annualReturn">年化收益率</button>
                <button class="tab" data-type="totalReturnRate">总收益率</button>
            </div>
            <div id="barChart" class="chart-wrap" style="height:360px;"></div>
        </div>

        <div style="text-align:center; font-size:12px; color:var(--text-muted);">每日00:00自动更新 · 手动刷新冷却1分钟 · 数据云端同步</div>
    </div>
    <div class="toast-wrap" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ========== Supabase 配置 ==========
            const SUPABASE_URL = 'https://zvkrwcxpsnwqxtcukovx.supabase.co';
            const SUPABASE_ANON_KEY =
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2a3J3Y3hwc253cXh0Y3Vrb3Z4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNjk4NzIsImV4cCI6MjA5ODY0NTg3Mn0._oLjDmy5usDnVNoK9ilb_Vf4BZDTUIV5pCO_0T6X24Y';

            let supabaseClient;
            if (typeof supabase !== 'undefined' && supabase.createClient) {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else if (window.supabase && window.supabase.createClient) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } else {
                throw new Error('Supabase 客户端未加载');
            }

            // ========== 全局状态 ==========
            let app = {
                goal: 100000,
                targetYear: null,
                manualMarketValue: null,
                assets: [],
                snapshots: [],
                lastUpdateDate: null,
                lastManualRefresh: null,
            };
            let pieChart = null,
                barChart = null;
            let currentChartType = 'totalValue';
            let isUpdating = false;
            let refreshTimeout = null;
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('assetDate').value = todayStr;

            // ========== Toast ==========
            function showToast(msg, type) {
                const container = document.getElementById('toastContainer');
                const t = document.createElement('div');
                t.className = 'toast';
                t.textContent = msg;
                container.appendChild(t);
                setTimeout(() => { if (t.parentNode) t.remove(); }, 3000);
            }

            // ========== 认证 ==========
            async function signIn(email, password) {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                return data.user;
            }

            async function signUp(email, password) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) throw error;
                return data.user;
            }

            async function signOut() {
                await supabaseClient.auth.signOut();
                app.assets = [];
                app.snapshots = [];
                renderAll();
                document.getElementById('syncStatus').textContent = '⏳ 未登录';
                showToast('已退出登录');
                setTimeout(showLoginPrompt, 500);
            }

            function showLoginPrompt() {
                const email = prompt('请输入登录邮箱（首次使用将自动注册）：');
                if (!email) return;
                const password = prompt('请输入密码（至少6位）：');
                if (!password || password.length < 6) {
                    alert('密码至少6位');
                    return;
                }
                signIn(email, password)
                    .then(user => {
                        showToast('✅ 登录成功');
                        loadUserData();
                    })
                    .catch(err => {
                        if (err.message && err.message.includes('Invalid login credentials')) {
                            if (confirm('用户不存在，是否注册新账号？')) {
                                signUp(email, password)
                                    .then(user => {
                                        showToast('✅ 注册成功');
                                        initializeUserData();
                                        loadUserData();
                                    })
                                    .catch(regErr => {
                                        alert('注册失败：' + (regErr.message || '未知错误'));
                                    });
                            }
                        } else {
                            alert('登录失败：' + (err.message || '未知错误'));
                        }
                    });
            }

            // ========== 数据读写 ==========
            async function loadUserData() {
                try {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    if (!user) {
                        document.getElementById('syncStatus').textContent = '⏳ 未登录';
                        return;
                    }
                    document.getElementById('syncStatus').textContent = '☁️ 已同步 (' + (user.email || '') + ')';

                    const { data, error } = await supabaseClient
                        .from('user_data')
                        .select('*')
                        .eq('user_id', user.id)
                        .maybeSingle();

                    if (error) {
                        console.error('加载数据失败', error);
                        showToast('❌ 加载数据失败');
                        return;
                    }

                    if (data) {
                        app.goal = data.goal || 100000;
                        app.targetYear = data.target_year || null;
                        app.manualMarketValue = data.manual_market_value ?? null;
                        app.assets = data.assets || [];
                        app.snapshots = data.snapshots || [];
                        app.lastUpdateDate = data.last_update_date || null;
                        app.lastManualRefresh = data.last_manual_refresh || null;
                    } else {
                        await initializeUserData();
                    }
                    updateMainTitle();
                    renderAll();
                    checkAutoUpdate();
                } catch (e) {
                    console.error('loadUserData error:', e);
                    showToast('❌ 加载数据出错');
                }
            }

            async function initializeUserData() {
                try {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    if (!user) return;
                    const { error } = await supabaseClient
                        .from('user_data')
                        .insert({
                            user_id: user.id,
                            goal: 100000,
                            target_year: null,
                            manual_market_value: null,
                            assets: [],
                            snapshots: [],
                            last_update_date: null,
                            last_manual_refresh: null
                        });
                    if (error) {
                        console.error('初始化数据失败', error);
                        showToast('⚠️ 初始化数据失败');
                    }
                } catch (e) { console.error(e); }
            }

            async function save() {
                try {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    if (!user) { showToast('❌ 未登录，无法保存'); return false; }
                    const payload = {
                        user_id: user.id,
                        goal: app.goal,
                        target_year: app.targetYear,
                        manual_market_value: app.manualMarketValue,
                        assets: app.assets,
                        snapshots: app.snapshots,
                        last_update_date: app.lastUpdateDate,
                        last_manual_refresh: app.lastManualRefresh,
                        updated_at: new Date().toISOString()
                    };
                    const { error } = await supabaseClient
                        .from('user_data')
                        .upsert(payload, { onConflict: 'user_id' });
                    if (error) { console.error('保存失败', error);
                        showToast('❌ 数据保存失败'); return false; }
                    return true;
                } catch (e) { console.error(e);
                    showToast('❌ 保存出错'); return false; }
            }

            // ========== 辅助 ==========
            function formatMoney(v) {
                if (v === null || v === undefined || isNaN(v)) return '--';
                return '¥' + Math.abs(v).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }

            function formatPercent(v) {
                if (v === null || v === undefined || isNaN(v)) return '--';
                return (v >= 0 ? '+' : '') + (v * 100).toFixed(2) + '%';
            }

            function daysBetween(d1, d2) {
                try { return Math.max(0, Math.floor((new Date(d2) - new Date(d1)) / 86400000)); } catch (_) { return 0; }
            }

            function updateMainTitle() {
                document.getElementById('mainTitle').textContent = app.targetYear ? '📊 ' + app.targetYear + '年投资计划' :
                    '📊 个人投资记录';
            }

            // ========== 行情接口（多重备用） ==========
            // ---- 核心腾讯 JSONP ----
            function fetchTencent(symbol, cb) {
                const callbackName = 'tq_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                const script = document.createElement('script');
                let resolved = false;
                const timeout = setTimeout(() => {
                    if (!resolved) { resolved = true; delete window[callbackName];
                        script.remove();
                        console.warn('⏰ 请求超时:', symbol);
                        cb(null); }
                }, 12000);

                window[callbackName] = function(data) {
                    if (resolved) return;
                    resolved = true;
                    clearTimeout(timeout);
                    delete window[callbackName];
                    script.remove();
                    try {
                        if (typeof data === 'string') {
                            let content = data;
                            const eqIdx = content.indexOf('=');
                            if (eqIdx !== -1) content = content.substring(eqIdx + 1);
                            content = content.trim();
                            if (content.startsWith('"') && content.endsWith('"')) content = content.substring(1, content
                                .length - 1);
                            content = content.replace(/\\"/g, '"');

                            // 股票/黄金格式
                            const parts = content.split('~');
                            if (parts.length >= 3) {
                                const name = parts[0] || symbol;
                                const price = parseFloat(parts[1]);
                                const prevClose = parseFloat(parts[2]);
                                if (!isNaN(price) && price > 0) {
                                    cb({ name, price, change: prevClose > 0 ? (price - prevClose) / prevClose : 0 });
                                    return;
                                }
                            }
                            // 基金JSON
                            try {
                                const jsonData = JSON.parse(content);
                                if (jsonData && jsonData.gsz) {
                                    const price = parseFloat(jsonData.gsz);
                                    const change = parseFloat(jsonData.gszzl || 0) / 100;
                                    if (!isNaN(price) && price > 0) {
                                        cb({ name: jsonData.name || symbol, price, change });
                                        return;
                                    }
                                }
                            } catch (_) {}
                            // 嵌套引号
                            const match = content.match(/="([^"]*)"/);
                            if (match) {
                                const inner = match[1];
                                const parts2 = inner.split('~');

            // ========== 刷新行情 ==========
            async function refreshQuotes(force = false) {
                if (isUpdating) { showToast('⏳ 正在更新中...'); return; }
                const now = new Date();
                const today = now.toISOString().split('T')[0];
                if (!force && app.lastUpdateDate === today) { showToast('今日已更新，无需重复刷新'); return; }
                if (!force && now.getHours() !== 0) { scheduleMidnightUpdate(); }

                isUpdating = true;
                let hasError = false;
                let count = 0;

                try {
                    for (let asset of app.assets) {
                        try {
                            if (asset.type === 'stock') {
                                await new Promise(resolve => {
                                    fetchStock(asset.code, info => {
                                        if (info) { asset.currentPrice = info.price;
                                            asset.name = info.name || asset.name || asset.code; } else { hasError =
                                                true; }
                                        resolve();
                                    });
                                });
                                count++;
                            } else if (asset.type === 'fund') {
                                await new Promise(resolve => {
                                    fetchFund(asset.code, info => {
                                        if (info) { asset.currentPrice = info.price;
                                            asset.name = info.name || asset.name || asset.code; } else { hasError =
                                                true; }
                                        resolve();
                                    });
                                });
                                count++;
                            } else if (asset.type === 'gold') {
                                await new Promise(resolve => {
                                    fetchGold(info => {
                                        if (info) { asset.currentPrice = info.price;
                                            asset.name = info.name || asset.name || '黄金现货'; } else { hasError =
                                                true; }
                                        resolve();
                                    });
                                });
                                count++;
                            } else if (asset.type === 'cash') {
                                await new Promise(resolve => {
                                    fetchFund(asset.code || '000198', info => {
                                        if (info && info.price) { asset.yieldRate = info.price / 10000; } else { asset
                                                .yieldRate = asset.yieldRate || 0.0002; }
                                        asset.currentPrice = asset.amount + calcCashProfit(asset);
                                        resolve();
                                    });
                                });
                                count++;
                            } else if (asset.type === 'deposit') {
                                checkDepositMaturity(asset);
                                count++;
                            }
                            await new Promise(r => setTimeout(r, 200));
                        } catch (e) { console.error('刷新资产失败:', asset, e);
                            hasError = true; }
                    }

                    app.lastUpdateDate = today;
                    app.assets.forEach(a => checkDepositMaturity(a));
                    saveSnapshot();
                    await save();
                    renderAll();
                    showToast(hasError ? '⚠️ 部分行情获取失败，请检查网络' : '✅ 行情已更新 (' + count + '项)');
                } catch (e) { console.error(e);
                    showToast('❌ 刷新失败'); } finally { isUpdating = false; }
            }

            function calcCashProfit(asset) {
                if (!asset.date || !asset.yieldRate) return 0;
                return asset.amount * (asset.yieldRate) * (daysBetween(asset.date, todayStr) / 365);
            }

            function checkDepositMaturity(asset) {
                if (asset.type !== 'deposit' || !asset.maturityDate) return;
                const today = new Date(todayStr);
                const mat = new Date(asset.maturityDate);
                if (mat <= today && !asset.matured) {
                    asset.matured = true;
                    const days = daysBetween(asset.date, asset.maturityDate);
                    asset.maturityValue = asset.amount + asset.amount * (asset.rate / 100) * (days / 365);
                }
            }

            function saveSnapshot() {
                const m = computeMetrics();
                const today = new Date().toISOString().split('T')[0];
                const last = app.snapshots[app.snapshots.length - 1];
                if (last && last.date === today) {
                    Object.assign(last, {
                        totalValue: m.totalMarketValue || m.totalInvest || 0,
                        annualReturn: m.annualReturn,
                        totalReturnRate: m.totalReturn,
                        totalInvest: m.totalInvest || 0
                    });
                } else {
                    app.snapshots.push({
                        date: today,
                        totalValue: m.totalMarketValue || m.totalInvest || 0,
                        annualReturn: m.annualReturn,
                        totalReturnRate: m.totalReturn,
                        totalInvest: m.totalInvest || 0
                    });
                }
                if (app.snapshots.length > 400) app.snapshots.shift();
            }

            function scheduleMidnightUpdate() {
                if (refreshTimeout) clearTimeout(refreshTimeout);
                const now = new Date();
                const target = new Date(now);
                target.setHours(24, 0, 0, 0);
                refreshTimeout = setTimeout(() => { refreshQuotes(true);
                    refreshTimeout = null; }, target - now + 1000);
            }

            function checkAutoUpdate() {
                if (app.lastUpdateDate !== todayStr) {
                    const now = new Date();
                    if (now.getHours() === 0 || now.getHours() < 6) { refreshQuotes(true); } else { scheduleMidnightUpdate(); }
                }
            }

            async function manualRefresh() {
                if (app.lastManualRefresh && Date.now() - app.lastManualRefresh < 60000) {
                    showToast('⏳ 手动刷新需间隔1分钟');
                    return;
                }
                app.lastManualRefresh = Date.now();
                await save();
                await refreshQuotes(true);
            }

            // ========== 核心计算 ==========
            function computeMetrics() {
                let totalInvest = 0;
                app.assets.forEach(a => {
                    if (a.type === 'cash' || a.type === 'deposit') totalInvest += a.amount || 0;
                    else totalInvest += (a.cost || 0) * (a.amount || 0);
                });
                let marketValue = app.manualMarketValue;
                if (marketValue === null && app.assets.length > 0) {
                    marketValue = app.assets.reduce((s, a) => {
                        if (a.type === 'deposit') return s + (a.matured ? (a.maturityValue || a.amount) : a.amount);
                        if (a.type === 'cash') return s + (a.currentPrice || a.amount || 0);
                        return s + (a.currentPrice || a.cost || 0) * (a.amount || 0);
                    }, 0);
                } else if (marketValue === null) marketValue = 0;

                const goal = app.goal || 1;
                let earliestDate = null;
                app.assets.forEach(a => {
                    if (a.date && a.amount > 0 && a.type !== 'cash' && a.type !== 'deposit') {
                        const d = new Date(a.date);
                        if (!earliestDate || d < earliestDate) earliestDate = d;
                    }
                });
                app.assets.forEach(a => {
                    if (a.type === 'deposit' && a.date && a.amount > 0) {
                        const d = new Date(a.date);
                        if (!earliestDate || d < earliestDate) earliestDate = d;
                    }
                });
                let avgYears = 0;
                if (earliestDate) {
                    const days = daysBetween(earliestDate.toISOString().split('T')[0], todayStr);
                    avgYears = days / 365.25;
                }
                if (avgYears < 0.001) avgYears = 0.001;

                let totalReturn = null,
                    annualReturn = null;
                if (marketValue !== null && totalInvest > 0) {
                    totalReturn = (marketValue - totalInvest) / totalInvest;
                    const ratio = marketValue / totalInvest;
                    if (ratio > 0 && avgYears > 0) {
                        annualReturn = Math.pow(ratio, 1 / avgYears) - 1;
                        if (!isFinite(annualReturn)) annualReturn = null;
                    }
                }
                const goalComplete = marketValue !== null ? marketValue / goal : totalInvest / goal;
                return { totalInvest, totalMarketValue: marketValue, totalReturn, annualReturn, goalComplete, avgYears };
            }

            // ========== 加减仓 ==========
            async function adjustPosition(assetId, action) {
                const asset = app.assets.find(a => a.id === assetId);
                if (!asset) return showToast('资产不存在');
                if (asset.type === 'deposit' || asset.type === 'cash') return showToast('存款和现金不支持加减仓');
                const price = asset.currentPrice || asset.cost || 0;
                if (price <= 0) return showToast('当前价格无效，请先刷新行情');
                const amountInput = prompt(`请输入${action === 'add' ? '加仓' : '减仓'}金额（元）：`, '1000');
                if (amountInput === null) return;
                const amount = parseFloat(amountInput);
                if (isNaN(amount) || amount <= 0) return showToast('金额必须为正数');
                const quantity = amount / price;

                if (action === 'add') {
                    let cashAsset = app.assets.find(a => a.type === 'cash');
                    if (!cashAsset) {
                        cashAsset = { id: 'c' + Date.now(), type: 'cash', code: '000198', amount: 0, date: todayStr,
                            currentPrice: 0, name: '余额宝', yieldRate: 0.0002 };
                        app.assets.push(cashAsset);
                    }
                    if (cashAsset.amount < amount) return showToast(`现金不足！当前现金 ${formatMoney(cashAsset.amount)}`);
                    const oldQty = asset.amount || 0;
                    const oldCost = asset.cost || 0;
                    const newQty = oldQty + quantity;
                    const newCost = (oldQty * oldCost + amount) / newQty;
                    asset.amount = newQty;
                    asset.cost = newCost;
                    cashAsset.amount -= amount;
                    cashAsset.currentPrice = cashAsset.amount;
                    showToast(`✅ 加仓成功，买入 ${quantity.toFixed(4)} 份`);
                } else {
                    if ((asset.amount || 0) < quantity) return showToast(`持仓不足！当前持仓 ${asset.amount} 份`);
                    const newQty = (asset.amount || 0) - quantity;
                    asset.amount = newQty;
                    let cashAsset = app.assets.find(a => a.type === 'cash');
                    if (!cashAsset) {
                        cashAsset = { id: 'c' + Date.now(), type: 'cash', code: '000198', amount: 0, date: todayStr,
                            currentPrice: 0, name: '余额宝', yieldRate: 0.0002 };
                        app.assets.push(cashAsset);
                    }
                    cashAsset.amount += amount;
                    cashAsset.currentPrice = cashAsset.amount;
                    showToast(`✅ 减仓成功，卖出 ${quantity.toFixed(4)} 份`);
                }
                await save();
                renderAll();
                if (asset.amount <= 0.0001) {
                    app.assets = app.assets.filter(a => a.id !== asset.id);
                    await save();
                    renderAll();
                    showToast('持仓已清空，资产已移除');
                }
            }

            // ========== 渲染 ==========
            function renderAll() {
                const m = computeMetrics();
                document.getElementById('totalMarketValue').textContent = m.totalMarketValue !== null ? formatMoney(m
                    .totalMarketValue) : '--';
                const pc = m.goalComplete !== null ? (m.goalComplete * 100).toFixed(1) + '%' : '--';
                document.getElementById('goalPercent').textContent = pc;
                const pct = Math.min((m.goalComplete || 0) * 100, 100);
                document.getElementById('goalProgress').style.width = pct + '%';
                document.getElementById('goalProgress').className = 'progress-fill' + (m.goalComplete >= 1 ? ' over' : '');
                document.getElementById('goalMessage').textContent = m.totalMarketValue !== null ? (m.goalComplete >= 1 ?
                    '🎉 目标已达成' : '距离目标还差 ' + formatMoney(app.goal - m.totalMarketValue)) : '';
                document.getElementById('totalReturn').textContent = formatPercent(m.totalReturn);
                document.getElementById('totalReturnAmount').textContent = m.totalReturn !== null ? '盈亏 ' + formatMoney(m
                    .totalMarketValue - m.totalInvest) : '';
                document.getElementById('annualReturn').textContent = formatPercent(m.annualReturn);
                document.getElementById('annualNote').textContent = m.avgYears > 0 ? '加权投资约' + (m.avgYears * 12).toFixed(
                    1) + '个月' : '';
                document.getElementById('updateStatus').textContent = app.lastUpdateDate === todayStr ? '✅ 今日已更新' :
                    '⏳ 待更新';
                document.getElementById('goalInput').value = app.goal;

                    if (a.type === 'deposit') profit = a.matured ? '✅ 已到期' : '⏳ 存续中';

                            xAxis: { data: dates, axisLabel: { rotate: 25, fontSize: 10 } },
                            yAxis: { name: yName, nameLocation: 'end' },
                            dataZoom: [{ type: 'slider', height: 20, bottom: 8 }],
                            series: [{ data: yData, type: 'bar', color: '#3b5f7a', name: yName,
                                barMaxWidth: 40 }]
                        });
                    }
                    barChart.resize();
                } catch (e) { console.warn('柱状图渲染失败', e); }
            }

            // ========== 用户操作 ==========
            async function saveGoal() {
                const v = parseFloat(document.getElementById('goalInput').value);
                if (v > 0) { app.goal = v; await save();
                    renderAll();
                    showToast('目标金额已保存'); }
            }

            async function saveTargetYear() {
                const v = parseInt(document.getElementById('targetYearInput').value);
                if (!isNaN(v) && v >= 2025) { app.targetYear = v;
                    updateMainTitle(); await save();
                    renderAll();
                    showToast('目标年份已设定为 ' + v); }
            }

            async function addAsset() {
                const type = document.getElementById('assetType').value;
                const code = document.getElementById('assetCode').value.trim();
                const amount = parseFloat(document.getElementById('assetAmount').value);
                const cost = parseFloat(document.getElementById('assetCost').value);
                const date = document.getElementById('assetDate').value;
                if (!date || isNaN(amount) || amount <= 0) { showToast('请填写完整信息（日期、数量）'); return; }
                const asset = {
                    id: 'a' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    type: type,
                    code: code || (type === 'gold' ? 'au9999' : ''),
                    amount: amount,
                    date: date,
                    currentPrice: (type === 'cash' ? amount : (type === 'deposit' ? undefined : cost || 0)),
                    name: '',
                };
                if (type === 'deposit') {
                    const months = parseInt(code) || 12;
                    const mat = new Date(date);
                    mat.setMonth(mat.getMonth() + months);
                    asset.maturityDate = mat.toISOString().split('T')[0];
                    asset.matured = false;
                    asset.rate = cost || 2.5;
                    asset.amount = amount;
                } else if (type === 'cash') {
                    asset.yieldRate = 0.0002;
                    asset.currentPrice = amount;
                    asset.amount = amount;
                    asset.code = code || '000198';
                } else {
                    asset.cost = cost || 0;
                    asset.amount = amount;
                    if (cost === undefined || isNaN(cost)) { showToast('请填写成本价'); return; }
                }
                app.assets.push(asset);
                await save();
                renderAll();
                document.getElementById('assetCode').value = '';
                document.getElementById('assetAmount').value = '';
                document.getElementById('assetCost').value = '';
                showToast('✅ 资产已添加，正在刷新行情...');
                setTimeout(() => refreshQuotes(true), 500);
            }

            async function removeAsset(id) {
                if (!confirm('确认删除此资产？')) return;
                app.assets = app.assets.filter(a => a.id !== id);
                await save();
                renderAll();
                showToast('已删除');
            }

            async function rolloverDeposit(id) {
                const deposit = app.assets.find(a => a.id === id);
                if (!deposit || !deposit.matured) return;
                const old = deposit.maturityValue || deposit.amount;
                const naInput = prompt('转存金额（本息合计 ' + formatMoney(old) + '）', old.toFixed(2));
                if (naInput === null) return;
                const na = parseFloat(naInput);
                if (isNaN(na) || na <= 0) return;
                const nrInput = prompt('新年化利率（%）', (deposit.rate || 2.5).toFixed(2));
                if (nrInput === null) return;
                const nr = parseFloat(nrInput);
                if (isNaN(nr)) return;
                const tmInput = prompt('期限（月）', '12');
                if (tmInput === null) return;
                const tm = parseInt(tmInput);
                if (isNaN(tm) || tm <= 0) return;
                const diff = na - old;
                app.assets = app.assets.filter(a => a.id !== id);
                const mat = new Date(todayStr);
                mat.setMonth(mat.getMonth() + tm);
                app.assets.push({
                    id: 'd' + Date.now(),
                    type: 'deposit',
                    code: '',
                    amount: na,
                    rate: nr,
                    date: todayStr,
                    maturityDate: mat.toISOString().split('T')[0],
                    matured: false,
                    name: '定期存款'
                });
                if (Math.abs(diff) > 0.01) {
                    let cash = app.assets.find(a => a.type === 'cash');
                    if (!cash) {
                        cash = { id: 'c' + Date.now(), type: 'cash', code: '000198', amount: 0, date: todayStr,
                            currentPrice: 0, name: '余额宝', yieldRate: 0.0002 };
                        app.assets.push(cash);
                    }
                    cash.amount += diff;
                    cash.currentPrice = cash.amount;
                }
                await save();
                renderAll();
                showToast('✅ 转存完成');
            }

            // ========== 导入导出 ==========
            function exportToExcel() {
                try {
                    const wb = XLSX.utils.book_new();
                    const ad = [['类型', '代码/名称', '数量/金额', '成本/利率', '现价', '市值', '状态']];
                    app.assets.forEach(a => {
                        let mkt = 0;
                        if (a.type === 'deposit') mkt = a.matured ? (a.maturityValue || a.amount) : a.amount;
                        else if (a.type === 'cash') mkt = a.currentPrice || a.amount || 0;
                        else mkt = (a.currentPrice || a.cost || 0) * (a.amount || 0);
                        let st = a.type === 'deposit' ? (a.matured ? '已到期' : '存续中') : '';
                        ad.push([a.type, a.name || a.code || '', a.amount || '', a.type === 'deposit' ? (a.rate +
                            '%') : (a.cost || ''), a.currentPrice || '', mkt, st]);
                    });
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ad), '持仓明细');
                    if (app.snapshots.length) {
                        const sd = [['日期', '总市值', '年化收益率', '总收益率', '总投入']];
                        app.snapshots.forEach(s => sd.push([s.date, s.totalValue, s.annualReturn != null ? (s
                            .annualReturn * 100).toFixed(2) + '%' : '', s.totalReturnRate != null ? (s
                            .totalReturnRate * 100).toFixed(2) + '%' : '', s.totalInvest]));
                        XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sd), '历史快照');
                    }
                    XLSX.writeFile(wb, '投资记录_' + todayStr + '.xlsx');
                    showToast('📥 Excel已导出');
                } catch (e) { console.error(e);
                    showToast('❌ 导出失败'); }
            }

            function exportJSON() {
                try {
                    const data = {
                        goal: app.goal,
                        targetYear: app.targetYear,
                        manualMarketValue: app.manualMarketValue,
                        assets: app.assets,
                        snapshots: app.snapshots,
                        lastUpdateDate: app.lastUpdateDate,
                        lastManualRefresh: app.lastManualRefresh,
                        exportDate: new Date().toISOString()
                    };
                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = '投资数据_' + todayStr + '.json';
                    a.click();
                    showToast('📦 JSON已导出');
                } catch (e) { showToast('❌ 导出失败'); }
            }

            function importJSON(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!confirm('导入将覆盖当前数据，确认继续？')) return;
                        app.goal = data.goal || 100000;
                        app.targetYear = data.targetYear || null;
                        app.manualMarketValue = data.manualMarketValue ?? null;
                        app.assets = data.assets || [];
                        app.snapshots = data.snapshots || [];
                        app.lastUpdateDate = data.lastUpdateDate || null;
                        app.lastManualRefresh = data.lastManualRefresh || null;
                        await save();
                        renderAll();
                        showToast('✅ 数据导入成功');
                    } catch (err) { showToast('❌ 文件格式错误'); }
                };
                reader.readAsText(file);
                event.target.value = '';
            }

            // ========== 事件绑定 & 暴露全局 ==========
            document.querySelectorAll('.tab').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentChartType = this.dataset.type;
                    renderCharts();
                });
            });

            window.saveGoal = saveGoal;
            window.saveTargetYear = saveTargetYear;
            window.addAsset = addAsset;
            window.removeAsset = removeAsset;
            window.rolloverDeposit = rolloverDeposit;
            window.exportToExcel = exportToExcel;
            window.exportJSON = exportJSON;
            window.importJSON = importJSON;
            window.manualRefresh = manualRefresh;
            window.signOut = signOut;
            window.adjustPosition = adjustPosition;

            // 窗口自适应
            window.addEventListener('resize', () => {
                try { if (pieChart) pieChart.resize(); } catch (_) {}
                try { if (barChart) barChart.resize(); } catch (_) {}
            });

            // ========== 启动 ==========
            window.onload = async function() {
                try {
                    const { data: { user } } = await supabaseClient.auth.getUser();
                    if (user) { await loadUserData(); } else { showLoginPrompt(); }
                } catch (e) { console.error('启动失败:', e);
                    showToast('⚠️ 初始化失败，请刷新重试'); }
            };

        })();
    </script>
</body>
</html>
